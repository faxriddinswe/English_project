[project]
name = "sherzod-english-api"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn>=0.34,<1", "SQLAlchemy>=2.0,<3",
  "psycopg[binary]>=3.2,<4", "alembic>=1.15,<2", "pydantic-settings>=2.8,<3",
  "argon2-cffi>=25,<26", "httpx>=0.28,<1", 
  "Pillow>=11,<14", "boto3>=1.37,<2", "XlsxWriter>=3.3.1,<4",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.11,<1", "openpyxl>=3.1.5,<4"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = ["postgres: requires a disposable PostgreSQL *_test database"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.setuptools.packages.find]
include = ["app*"]
